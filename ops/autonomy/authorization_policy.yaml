swr_single_stage_repair:
  auto_authorized: true
  max_repairs_per_slice: 2
  max_repairs_per_stage: 1
  require_existing_run_manifest: true
  require_existing_review_bundle: true
  require_no_open_high_or_critical_failures: true
  require_repair_stage_id:
    - gate_and_contract_review
    - final_markdown_playbook

swr_review_history_repair:
  auto_authorized: true
  max_repairs_per_slice: 4
  max_repairs_per_stage: 2
  require_existing_run_manifest: true
  require_existing_review_bundle_for_stage_rerun: true
  require_repair_stage_id:
    - source_authority_map
    - repo_grounding
    - execution_row_draft
    - gate_and_contract_review
    - final_markdown_playbook

po_escalation_repair:
  auto_authorized: true
  max_repaired_resumes_per_item: 1
  require_closed_audit_failure: true
  require_closure_evidence: true
  require_retarget_ancestry_proof: true

terminal_recovery:
  auto_authorized: true
  require_po_terminal_passed: true
  require_no_open_failures_for_run: true
  run_before_playbook_generation: true

remaining_v1_autonomous_launch:
  auto_authorized: true
  required_completed_slices:
    - S01
    - S02
    - S03
    - S04
  required_next_slice: S05
  require_no_active_run: true
  require_no_active_swr_run: true
  require_no_open_high_or_critical_failures: true
  required_commands:
    - python scripts/verify_failure_ledger.py --json
    - python scripts/verify_autokeel_invariants.py --json
    - python scripts/verify_s05_readiness.py --json
    - python -m ops.autonomy.autokeel --once --dry-run --slice S05

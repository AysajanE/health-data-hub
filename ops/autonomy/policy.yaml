mode: autonomous_zero_human
keel_root: /Users/aeziz-local/keel
plan_orchestrator_root: /Users/aeziz-local/keel/tools/plan-orchestrator
product_repo: /Users/aeziz-local/health-data-hub

compile:
  design_doc: docs/gstack/health-data-hub-office-hours.md
  row_author: external-json
  row_author_command: python scripts/autokeel_row_author.py
  row_author_allow_repo_cwd: true
  allow_warnings_reason: AutoKeel autonomous profile forbids manual gates; S01 uses deterministic tests and autonomous review artifacts instead.

autoplan:
  auto_generate_missing: true
  command: claude -p

lanes:
  compiler: keel-compile
  compiler_external_evidence: keel-compile
  swr_preferred: use_swr

swr:
  task_pack_source: tools/staged-workflow-runner/automation/task_packs/gstack_design_to_po_playbook
  task_pack_workdir: .local/autokeel/swr/task_packs/gstack_design_to_po_playbook
  workflow_file: .local/autokeel/swr/task_packs/gstack_design_to_po_playbook/workflows/gstack_design_to_po_playbook.workflow.json
  output_root: .local/autokeel/swr/runs
  max_wait_seconds: 5

slice_statuses:
  actionable:
    - pending
    - waiting_for_playbook
    - replan_required
    - evidence_ready
  blocked:
    - blocked
    - blocked_external
    - blocked_external_waiting_for_evidence
    - blocked_compile_inputs
    - complete

manual_gates:
  allowed: false
  if_detected: record_failure_and_recompile
  forbidden_commands:
    - keel-run mark-manual-gate
    - mark-manual-gate

external_evidence:
  ai_operator_may_collect: true
  must_store_locally: true
  allowed_dirs:
    - private/evidence
    - docs/evidence
  must_redact_secrets: true

health_data:
  raw_data_in_git: false
  secrets_in_git: false
  full_payloads_in_general_logs: false
  forbidden_tracked_roots:
    - data
    - private
  forbidden_tracked_names:
    - .env
    - warehouse.duckdb

model_outputs:
  may_override_baseline_gate: false
  may_override_n_model_gate: false
  may_override_sign_stability_gate: false
  n_model_ui_threshold: 37
  baseline_gate_required: true
  sign_stability_counterfactual_threshold: 0.90

tripwires:
  apply_design_doc_tripwires: true
  on_oura_failure_week_1: direct_oura_oauth
  on_pyeight_failure_week_2: oura_only_v1
  on_mood_transport_failure_week_4: streamlit_mobile_form
  on_mood_compliance_failure_week_8: stop_modeling_fix_logging
  on_baseline_gate_failure_week_9: collecting_state_no_override

tripwire_deadlines:
  on_oura_failure_week_1:
    date: 2026-05-30
    action: direct_oura_oauth
    evidence: private/evidence/S03/oura_smoke
  on_pyeight_failure_week_2:
    date: 2026-06-06
    action: oura_only_v1
    evidence: private/evidence/S03/pyeight_smoke
  on_mood_transport_failure_week_4:
    date: 2026-06-20
    action: streamlit_mobile_form
    evidence: private/evidence/S03/mood_shortcut_smoke
  on_mood_compliance_failure_week_8:
    date: 2026-07-18
    action: stop_modeling_fix_logging
    evidence: docs/reviews/s07-autonomous-ui-language-review.md
  on_baseline_gate_failure_week_9:
    date: 2026-07-25
    action: collecting_state_no_override
    evidence: docs/reviews/s05-autonomous-model-gate-review.md

playbook_validation:
  banned_language:
    - manual approval
    - human approval
  forbidden_roots:
    - .
    - src
    - tests
  forbidden_commands:
    - mark-manual-gate
  required_gate_terms: []
  required_gate_terms_by_risk:
    high:
      - autonomous_gate_review
  required_columns:
    - action
    - deliverable
    - allowed_write_roots
    - requires_red_green
    - required_verification_commands
    - exit_criteria

acceptance_commands:
  allow_prefixes:
    - python -m pytest
  allow_commands:
    - python scripts/check_schema_contract.py
    - python scripts/check_no_tracked_data.py
    - python scripts/check_autonomous_review_exists.py
    - python scripts/setup_permissions.py
    - python scripts/evidence/oura_smoke.py

evidence_collectors:
  s03_oura_smoke: scripts/evidence/oura_smoke.py
  s03_pyeight_smoke: scripts/evidence/pyeight_smoke.py
  s03_mood_shortcut_smoke: scripts/evidence/mood_shortcut_smoke.py

reviews:
  auto_generate_missing: true
  reviewer_command: claude -p
  prompt: ops/autonomy/prompts/slice_reviewer.md
  security_requires_two_ai_reviews: true
  model_requires_two_ai_reviews: true
  ui_language_requires_banned_word_scan: true
  required_review_root: docs/reviews

loop:
  stop_only_when: scripts/verify_v1.py
  max_retries_per_slice_before_replan: 3
  stale_run_minutes: 60
  po_timeout_seconds: 7200
  po_supervisor_wait_seconds: 5
  heartbeat_path: ops/autonomy/heartbeats/latest.json

commands:
  optional_tools:
    - claude
    - codex
    - gh
    - jq
  keel_wrappers:
    - keel-smoke
    - keel-compile
    - keel-run
    - keel-doctor
    - keel-swr
